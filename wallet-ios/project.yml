# XcodeGen spec — run `xcodegen` in this folder to create Cashline.xcodeproj.
# (brew install xcodegen). The generated project is git-ignored; this file is
# the source of truth.
name: Cashline
options:
  bundleIdPrefix: io.github.mingjun97
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # set your team to run on a device

packages:
  CashlineCore:
    path: Packages/CashlineCore
  # Uncomment to enable real Plaid Link (see README "Connecting Plaid"):
  # LinkKit:
  #   url: https://github.com/plaid/plaid-link-ios-spm
  #   majorVersion: 6.0.0

targets:
  Cashline:
    type: application
    platform: iOS
    sources:
      - path: Cashline
    dependencies:
      - package: CashlineCore
      # - package: LinkKit
    info:
      path: Cashline/Info.plist
      properties:
        CFBundleDisplayName: Cashline
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        LSSupportsOpeningDocumentsInPlace: false
        UIFileSharingEnabled: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mingjun97.cashline
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
